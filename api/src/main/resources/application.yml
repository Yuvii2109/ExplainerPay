spring:
  application:
    name: pxe-api
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/pxe}
    username: ${SPRING_DATASOURCE_USERNAME:pxe}
    password: ${SPRING_DATASOURCE_PASSWORD:pxe}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

pxe:
  # Overridden in docker-compose.yml, where data/ is bind-mounted read-only at /app/data.
  # The default resolves when Maven runs with api/ as its base directory.
  scenarios-resource: file:../data/payment-scenarios.json
  expectations-resource: file:../data/expectations.json
  rail-sequences-resource: file:../data/rail-sequences.json
  ai-url: ${PXE_AI_URL:http://localhost:18000}
  causes-resource: file:../data/causes.json
  cause-templates-resource: file:../data/cause-templates.json
  stream:
    # Hops are paced to demo tempo. PXE-007 spans nine days; the wait is still
    # the content, just compressed.
    hop-delay-ms: 320

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always
